name: Updater release

# Pushing a tag like updater-v1.0.0 publishes BPGP Updater as its own GitHub Release with
# BPGPUpdater.exe, separate from the addon releases (tags v*, see release.yml).
# The release is never marked "Latest", so GitHub's latest release stays the addon.
# Tags with "alpha" or "beta" become a pre-release, which the updater's self-update skips.

on:
  push:
    tags: ['updater-v*']

permissions:
  contents: write

jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build BPGPUpdater.exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring('updater-v'.Length)
          dotnet publish updater/BPGPUpdater.csproj -c Release -o out "-p:Version=$version"

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring('updater-v'.Length)
          $notes = "BPGP Updater $version. Download BPGPUpdater.exe and run it: it installs and updates the BPGP addon. Already have it? It updates itself.`n`nWindows may say 'Windows protected your PC' because the exe isn't signed: click More info, then Run anyway."
          $flags = @('--latest=false')
          if ($version -match 'alpha|beta') { $flags += '--prerelease' }
          gh release create $tag out/BPGPUpdater.exe --repo '${{ github.repository }}' --title "BPGP Updater $version" --notes $notes @flags
