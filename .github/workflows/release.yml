name: Release

# Pushing a tag like v1.0.0 publishes the addon as a GitHub Release with BPGP-v1.0.0.zip,
# built by the BigWigs packager (fills in @project-version@, uses .pkgmeta), and uploads the
# same build to CurseForge.
# Tags with "alpha" or "beta" become a pre-release on GitHub (BPGP Updater skips those) and an
# alpha/beta file on CurseForge.
# BPGP Updater (Blood-Promise/bpgp-updater) installs from the GitHub releases and needs the zip
# to contain BPGP/BPGP.toc with the version filled in.
# CurseForge is a separate job, so a failed upload there (moderation, API trouble) never blocks
# the GitHub Release. The project ID is in the TOC (X-Curse-Project-ID); the upload token is
# the repository secret CF_API_TOKEN. Without the secret the upload is skipped with a notice.
# See docs/curseforge.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager needs history and tags

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

  curseforge:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check CurseForge token
        id: check
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::notice::Repository secret CF_API_TOKEN is not set, skipping the CurseForge upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          fetch-depth: 0

      # Only the CurseForge token is passed, so this run doesn't touch the GitHub Release.
      - uses: BigWigsMods/packager@v2
        if: steps.check.outputs.skip != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
