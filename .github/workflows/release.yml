name: Release

# Pushing a tag like v1.0.0 publishes the addon as a GitHub Release with BPGP-v1.0.0.zip,
# built by the BigWigs packager (fills in @project-version@, uses .pkgmeta), and uploads the
# same build to CurseForge.
# Tags with "alpha" or "beta" become a pre-release on GitHub (BPGP Updater skips those) and an
# alpha/beta file on CurseForge.
# BPGP Updater (Blood-Promise/bpgp-updater) installs from the GitHub releases and needs the zip
# to contain BPGP/BPGP.toc with the version filled in.
# CurseForge is a separate job, so a failed upload there (moderation, API trouble) never blocks
# the GitHub Release. It needs the repository variable CF_PROJECT_ID and the secret
# CF_API_TOKEN; without CF_PROJECT_ID the job is skipped. See docs/release-plan-v1.md §10.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager needs history and tags

      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

  curseforge:
    needs: package
    if: ${{ vars.CF_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check CurseForge settings
        env:
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if ! [[ "$CF_PROJECT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Repository variable CF_PROJECT_ID must be the numeric CurseForge project ID."
            exit 1
          fi
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Repository secret CF_API_TOKEN is missing (CurseForge upload token)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the CurseForge token is passed, so this run doesn't touch the GitHub Release.
      - uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CF_PROJECT_ID }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
